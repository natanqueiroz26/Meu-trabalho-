<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEU TRABALHO</title>

    <link rel="icon" type="image/png" href="Icon.png.png">
    <link rel="apple-touch-icon" href="Icon.png.png">
    <meta name="theme-color" content="#f8fafc">

    <style>
        :root { 
            --bg: #f8fafc;
            --card-dark: #121826;
            --card-light: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-purple: #5865f2;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text-dark); 
            padding: 15px; 
            max-width: 480px; 
            margin: 0 auto;
            padding-bottom: 40px;
        }

        header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 5px 20px 5px;
        }
        .header-brand { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-weight: 800; 
            font-size: 15px; 
            letter-spacing: 1.5px;
        }
        .header-brand img { width: 28px; height: 28px; object-fit: contain; }
        .btn-gear { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); opacity: 0.8; }

        nav { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding-bottom: 15px; 
            scrollbar-width: none;
        }
        nav::-webkit-scrollbar { display: none; }
        nav button { 
            background: transparent; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--text-muted); 
            white-space: nowrap; 
            cursor: pointer;
            transition: all 0.2s;
        }
        nav button.active { 
            background: var(--card-dark); 
            color: white; 
        }

        .card-resumo { 
            background: var(--card-dark); 
            color: white; 
            border-radius: 28px; 
            padding: 24px 20px 20px 20px; 
            position: relative; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        .btn-relatorio-top {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #232d42;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }
        .card-resumo .label-saldo { 
            font-size: 10px; 
            font-weight: 700; 
            letter-spacing: 1.5px; 
            color: #94a3b8; 
            text-align: center; 
            display: block; 
            margin-bottom: 5px;
        }
        .card-resumo .valor-saldo { 
            font-size: 34px; 
            font-weight: 800; 
            text-align: center; 
            margin: 0 0 20px 0;
        }
        .divisoria { border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        .grid-detalhes { display: flex; justify-content: space-around; text-align: center; }
        .item-detalhe span { display: block; font-size: 9px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; margin-bottom: 4px; }
        .item-detalhe b { font-size: 14px; color: white; font-weight: 700; }

        .btn-historico-completo { 
            width: 100%; 
            background: #e2e8f0; 
            border: none; 
            padding: 12px; 
            border-radius: 14px; 
            font-size: 11px; 
            font-weight: 800; 
            color: #475569; 
            letter-spacing: 0.5px; 
            cursor: pointer; 
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .grid-botoes-acao { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-add { 
            flex: 1; 
            background: white; 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 12px; 
            letter-spacing: 0.5px; 
            color: var(--text-dark); 
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .btn-baixa { 
            flex: 1; 
            background: var(--accent-purple); 
            border: none; 
            padding: 14px; 
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 12px; 
            letter-spacing: 0.5px; 
            color: white; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
        }

        .card-registro { 
            background: white; 
            border-radius: 18px; 
            padding: 16px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid #f1f5f9;
        }
        .info-esq { display: flex; flex-direction: column; gap: 4px; }
        .data-linha { font-size: 10px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .nome-linha { font-size: 15px; font-weight: 800; color: var(--text-dark); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .servico-linha { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .valor-dir { text-align: right; }
        .valor-verde { font-size: 15px; font-weight: 800; color: var(--accent-green); }
        .bruto-sub { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }

        .acoes-item-popup { display: flex; gap: 10px; margin-top: 8px; }
        .btn-ico { border: none; background: none; cursor: pointer; font-size: 14px; opacity: 0.6; }

        .caixa-form { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); display: none; }
        label { display: block; margin-bottom: 5px; font-size: 10px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.5px; }
        input, select { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; background: #fff; }

        #modal-historico, #modal-config, #modal-comprovante { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.6); z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(4px); }
        .modal-body { background:white; width:90%; max-width:400px; border-radius:24px; padding:20px; max-height:80vh; overflow-y:auto; }
        
        .tag-servico { background: #f1f5f9; padding: 8px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 6px; }
    </style>
</head>
<body>

<header>
    <div class="header-brand">
        <img src="Icon.png.png" alt="Logo" onerror="this.style.display='none'">
        <span>MEU TRABALHO</span>
    </div>
    <button class="btn-gear" onclick="abrirConfig()">⚙️</button>
</header>

<nav>
    <button onclick="mudar('horas')" id="btn-horas">HORA EXTRA</button>
    <button onclick="mudar('reparos')" id="btn-reparos" class="active">REPAROS</button>
    <button onclick="mudar('assist')" id="btn-assist">ASSISTÊNCIA</button>
    <button onclick="mudar('aulas')" id="btn-aulas">AULAS</button>
    <button onclick="mudar('diaria')" id="btn-diaria">DIÁRIA</button>
</nav>

<div class="card-resumo">
    <button class="btn-relatorio-top" onclick="gerarRelatorio()" title="Gerar Relatório">📥</button>
    <span class="label-saldo" id="label-saldo-topo">SALDO REPAROS</span>
    <h1 class="valor-saldo" id="val-saldo-topo">R$ 0,00</h1>
    <div class="divisoria"></div>
    <div class="grid-detalhes" id="painel-detalhes-topo">
        <div class="item-detalhe">
            <span>BRUTO TOTAL</span>
            <b id="val-bruto-topo">R$ 0.00</b>
        </div>
        <div class="item-detalhe">
            <span>GASTO PEÇAS</span>
            <b id="val-gasto-topo">R$ 0.00</b>
        </div>
    </div>
</div>

<button class="btn-historico-completo" onclick="abrirHistorico()">📦 HISTÓRICO COMPLETO</button>

<div class="grid-botoes-acao">
    <button class="btn-add" onclick="abrirForm()">+ ADICIONAR</button>
    <button class="btn-baixa" onclick="fecharMes()">BAIXA</button>
</div>

<div class="caixa-form" id="form-adicionar">
    <label>Data</label>
    <input type="date" id="f-d">

    <div id="campos-dinamicos"></div>

    <div style="display:flex; gap:10px; margin-top:10px;">
        <button onclick="salvar()" style="flex:1; background:var(--card-dark); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Salvar</button>
        <button onclick="fecharForm()" style="flex:1; background:#e2e8f0; color:#334155; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Cancelar</button>
    </div>
</div>

<div id="lista-cards"></div>

<div id="modal-historico">
    <div class="modal-body">
        <h3 style="margin-top:0;">📜 Histórico Encerrado</h3>
        <div id="conteudo-historico"></div>
        <button onclick="fecharHistorico()" style="width:100%; padding:12px; background:#e2e8f0; border:none; border-radius:12px; font-weight:bold; margin-top:15px; cursor:pointer;">Fechar</button>
    </div>
</div>

<div id="modal-config">
    <div class="modal-body" style="text-align:center;">
        <h3 style="margin-top:0;">⚙️ Configurações e Backup</h3>
        <p style="font-size:12px; color:var(--text-muted);">Gerencie os dados salvos no seu aparelho.</p>
        <button onclick="exportarBackup()" style="width:100%; padding:12px; background:var(--card-dark); color:white; border:none; border-radius:12px; font-weight:bold; margin-bottom:10px; cursor:pointer;">BAIXAR BACKUP</button>
        <button onclick="document.getElementById('input-importar').click()" style="width:100%; padding:12px; background:#e2e8f0; color:var(--text-dark); border:none; border-radius:12px; font-weight:bold; cursor:pointer;">RESTAURAR BACKUP</button>
        <input type="file" id="input-importar" style="display:none;" onchange="importarBackup(event)">
        <button onclick="fecharConfig()" style="width:100%; padding:10px; background:none; border:none; color:red; margin-top:10px; font-weight:bold; cursor:pointer;">Fechar</button>
    </div>
</div>

<div id="modal-comprovante">
    <div class="modal-body">
        <h3 style="margin-top:0;">📄 Relatório</h3>
        <div id="conteudo-comprovante" style="white-space: pre-wrap; font-size:12px; background:#f1f5f9; padding:10px; border-radius:10px;"></div>
        <button id="btn-wpp" style="width:100%; background:#22c55e; color:white; border:none; padding:14px; border-radius:12px; font-weight:bold; margin-top:15px; cursor:pointer;">ENVIAR WHATSAPP</button>
        <button onclick="fecharComprovante()" style="width:100%; background:#e2e8f0; border:none; padding:12px; border-radius:12px; font-weight:bold; margin-top:8px; cursor:pointer;">FECHAR</button>
    </div>
</div>

<script>
    const CHAVE = 'meu_trabalho_app_v2';
    
    function initDB() {
        let def = { horas:[], reparos:[], assist:[], aulas:[], diaria:[], hist_horas:[], hist_reparos:[], hist_assist:[], hist_aulas:[], hist_diaria:[] };
        let s = localStorage.getItem(CHAVE);
        if(!s) return def;
        try { return JSON.parse(s); } catch(e){ return def; }
    }

    var db = initDB();
    var secao = 'reparos';
    var edicaoIdx = -1;
    var listaServicosTemp = [];

    const tabelaPrecos = [
        { nome: "Rasgo bladder grande", preco: 150 },
        { nome: "Rasgo bladder médio", preco: 100 },
        { nome: "Rasgo bladder pequeno", preco: 50 },
        { nome: "Furo 1/2", preco: 50 },
        { nome: "Furo 3/5", preco: 100 },
        { nome: "Colagem de válvula normal", preco: 50 },
        { nome: "Colagem de válvula central", preco: 80 },
        { nome: "Troca de mangueirinha", preco: 40 },
        { nome: "Regulagem de barra simples", preco: 35 }
    ];

    function mudar(s) {
        secao = s;
        edicaoIdx = -1;
        listaServicosTemp = [];
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        let btn = document.getElementById('btn-' + s);
        if(btn) btn.classList.add('active');
        fecharForm();
        render();
    }

    function formatarData(d) {
        if(!d) return '';
        let [y, m, day] = d.split('-');
        return `${day}/${m}/${y}`;
    }

    function abrirForm() {
        let f = document.getElementById('form-adicionar');
        document.getElementById('f-d').value = new Date().toISOString().split('T')[0];
        montarCamposForm();
        f.style.display = 'block';
    }

    function fecharForm() {
        document.getElementById('form-adicionar').style.display = 'none';
        edicaoIdx = -1;
        listaServicosTemp = [];
    }

    function montarCamposForm() {
        let c = document.getElementById('campos-dinamicos');
        if(secao === 'reparos') {
            c.innerHTML = `
                <label>Nome do Cliente</label>
                <input type="text" id="f-cli" placeholder="Ex: Rama">
                
                <label>Serviço</label>
                <select id="f-sel-ser" onchange="aoMudarServico()">
                    <option value="">-- Selecione --</option>
                    ${tabelaPrecos.map((p, i) => `<option value="${i}">${p.nome} - R$ ${p.preco}</option>`).join('')}
                    <option value="custom">+ Personalizado</option>
                </select>

                <div id="box-qtd" style="display:none;">
                    <label>Quantidade</label>
                    <input type="number" id="f-qtd" value="1">
                    <button type="button" onclick="addServico()" style="width:100%; padding:8px; background:var(--card-dark); color:white; border:none; border-radius:8px; margin-bottom:10px;">Adicionar Serviço</button>
                </div>

                <div id="box-custom" style="display:none;">
                    <label>Nome do Serviço Avulso</label>
                    <input type="text" id="f-ser-custom">
                    <label>Valor Bruto (R$)</label>
                    <input type="number" id="f-bru-custom">
                    <button type="button" onclick="addServico()" style="width:100%; padding:8px; background:var(--card-dark); color:white; border:none; border-radius:8px; margin-bottom:10px;">Adicionar Serviço</button>
                </div>

                <div id="lista-temp"></div>

                <label>Valor Bruto Total (R$)</label>
                <input type="number" id="f-bru" placeholder="0.00">
                <label>Gasto Peças (R$)</label>
                <input type="number" id="f-gas" value="0">
            `;
        } else if(secao === 'diaria') {
            c.innerHTML = `<label>Valor Diária (R$)</label><input type="number" id="f-vd" placeholder="0.00">`;
        } else {
            c.innerHTML = `
                <label>${secao === 'horas' ? 'Horas Trabalhadas' : (secao === 'assist' ? 'Quantidade' : 'Horas de Aula')}</label>
                <input type="number" step="0.1" id="f-q" placeholder="Ex: 1.5">
                ${secao === 'aulas' ? '<label>Nome Aluno</label><input type="text" id="f-aluno" placeholder="Ex: Maria">' : ''}
            `;
        }
    }

    function aoMudarServico() {
        let v = document.getElementById('f-sel-ser').value;
        document.getElementById('box-qtd').style.display = (v && v !== 'custom') ? 'block' : 'none';
        document.getElementById('box-custom').style.display = (v === 'custom') ? 'block' : 'none';
    }

    function addServico() {
        let sel = document.getElementById('f-sel-ser').value;
        if(sel === 'custom') {
            let n = document.getElementById('f-ser-custom').value || 'Serviço';
            let p = parseFloat(document.getElementById('f-bru-custom').value) || 0;
            listaServicosTemp.push({ nome: n, preco: p });
        } else if(sel !== '') {
            let item = tabelaPrecos[parseInt(sel)];
            let q = parseInt(document.getElementById('f-qtd').value) || 1;
            listaServicosTemp.push({ nome: q > 1 ? `${q}x ${item.nome}` : item.nome, preco: item.preco * q });
        }
        
        let tot = listaServicosTemp.reduce((a, b) => a + b.preco, 0);
        document.getElementById('f-bru').value = tot;
        document.getElementById('lista-temp').innerHTML = listaServicosTemp.map((s, idx) => `
            <div class="tag-servico"><span>${s.nome}</span><span onclick="listaServicosTemp.splice(${idx},1);addServico();" style="color:red;cursor:pointer;">✕</span></div>
        `).join('');
    }

    function salvar() {
        let d = document.getElementById('f-d').value;
        if(!d) return alert('Selecione a data');
        let reg = { data: d };

        if(secao === 'reparos') {
            reg.cliente = document.getElementById('f-cli').value || 'Avulso';
            reg.bruto = parseFloat(document.getElementById('f-bru').value) || 0;
            reg.gasto = parseFloat(document.getElementById('f-gas').value) || 0;
            reg.ser = listaServicosTemp.length ? listaServicosTemp.map(x=>x.nome).join(', ') : (document.getElementById('f-ser-custom')?.value || 'Reparo');
            reg.valorMeu = (reg.bruto - reg.gasto) / 2;
        } else if(secao === 'diaria') {
            reg.valorMeu = parseFloat(document.getElementById('f-vd').value) || 0;
        } else {
            let q = parseFloat(document.getElementById('f-q').value) || 0;
            let mult = (secao === 'horas') ? 10 : (secao === 'assist' ? 50 : 100);
            reg.qtd = q;
            reg.aluno = document.getElementById('f-aluno')?.value || '';
            reg.valorMeu = q * mult;
        }

        if(edicaoIdx >= 0) db[secao][edicaoIdx] = reg;
        else db[secao].push(reg);

        db[secao].sort((a,b) => new Date(b.data) - new Date(a.data));
        localStorage.setItem(CHAVE, JSON.stringify(db));
        fecharForm();
        render();
    }

    function deletar(i) {
        if(confirm('Excluir este item?')) {
            db[secao].splice(i, 1);
            localStorage.setItem(CHAVE, JSON.stringify(db));
            render();
        }
    }

    function editar(i) {
        let item = db[secao][i];
        edicaoIdx = i;
        abrirForm();
        document.getElementById('f-d').value = item.data;
        if(secao === 'reparos') {
            document.getElementById('f-cli').value = item.cliente || '';
            document.getElementById('f-bru').value = item.bruto || 0;
            document.getElementById('f-gas').value = item.gasto || 0;
        } else if(secao === 'diaria') {
            document.getElementById('f-vd').value = item.valorMeu || 0;
        } else {
            document.getElementById('f-q').value = item.qtd || 0;
            if(item.aluno) document.getElementById('f-aluno').value = item.aluno;
        }
    }

    function render() {
        let list = db[secao] || [];
        let totalMeu = 0, totalBr
